[package]
name = "mcpg-plugin-log-syslog"
version = "0.1.0-alpha.16"
license = "Apache-2.0"
edition = "2024"
description = "Syslog log_sink plugin for MCPG (dev.mcpg.log.syslog) — RFC 5424 / RFC 3164 over UDP / TCP / stdout / stderr."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14", features = ["static-firstparty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"

[features]
default = ["cdylib-export"]
cdylib-export = []
static-firstparty = []
